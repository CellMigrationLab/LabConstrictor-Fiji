name: release
# Builds the plugin jar for a release tag, smoke-tests THAT jar in Fiji, and (only for a published release) attaches
#   labconstrictor-fiji-<tag>.jar, labconstrictor-fiji-script-<tag>.zip (script + lib) and SHA256SUMS to the release.
# The jar is built once (Linux, Java 8 bytecode). It is smoked on Linux (blocks the publish) and, best effort, on Windows and macOS arm64
# (they report in the run summary and never block a release).
# Dry run: Actions > release > Run workflow, with a tag (e.g. v0.2.0-dry), or a pull request that changes this file or pom.xml. It builds, smokes and uploads the same files as
# workflow artifacts; it never creates a tag or a release.
#
# Version: the committed pom.xml is not changed. The workflow sets the version in its own checkout with
# `mvn versions:set -DnewVersion=<tag without a leading v>`, so the jar's manifest and file name carry the tag.
on:
  release:
    types: [published]
  pull_request:  # a change to this workflow or to the build is dry-run like a manual run (tag v0.0.0-pr); nothing is published
    paths: [".github/workflows/release.yml", "pom.xml", ".github/smoke/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build as (dry run: nothing is published), e.g. v0.2.0-dry"
        required: true
        type: string
permissions:
  contents: read
env:
  # Same Fiji as the GUI cases (README, Tests): the build with a Java 21 JDK. Pinned by the cache; to move to a newer Fiji, change FIJI_PIN.
  FIJI_URL: https://downloads.imagej.net/fiji/latest/fiji-latest-linux64-jdk.zip
  FIJI_PIN: "2026-10-07"
  # The smoke: one dialog case through the menu command and one macro case (run("LabConstrictor Tools...", "...")), both through the jar.
  SMOKE_CASES: "progress_events cal_macro_with_a_pixel_size_is_a_value_the_person_gave"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Resolve the tag and the version
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$EVENT" in release) tag="$RELEASE_TAG" ;; workflow_dispatch) tag="$INPUT_TAG" ;; *) tag="v0.0.0-pr" ;; esac
          if ! printf '%s' "$tag" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$tag' is not like v1.2.3 or 1.2.3-rc1"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
      - name: Build the jar as the tag
        run: |
          mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn -B package
          mkdir release-files
          cp "target/labconstrictor-fiji-$VERSION.jar" "release-files/labconstrictor-fiji-$TAG.jar"
          unzip -l "release-files/labconstrictor-fiji-$TAG.jar" | grep -q 'org/cellmigrationlab/labconstrictor/lib/LCCompat.groovy'   # the helpers are inside the jar
          # the no-jar alternative: the script is not self-contained any more (it loads lib/*.groovy), so it is shipped with its lib folder
          (cd src/main/resources/org/cellmigrationlab/labconstrictor && zip -q -r "$GITHUB_WORKSPACE/release-files/labconstrictor-fiji-script-$TAG.zip" LabConstrictor_Tools.groovy lib)
          unzip -p "release-files/labconstrictor-fiji-$TAG.jar" META-INF/MANIFEST.MF | tr -d '\r' | grep -E '^Implementation-Version: '"$VERSION"'$'
          (cd release-files && sha256sum labconstrictor-fiji-"$TAG".jar labconstrictor-fiji-script-"$TAG".zip | tee SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: release-files
          retention-days: 14
  smoke-linux:
    # The gate of the release: the jar of `build`, byte for byte, through the GUI cases below.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: release-files
      - name: Put the jar where tests/run_cases.py looks for it
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          mkdir target
          cp "release-files/labconstrictor-fiji-$TAG.jar" "target/labconstrictor-fiji-${TAG#v}.jar"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Install xvfb and the libraries Fiji's Swing/AWT needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libxtst6 libxrender1 libxi6 libxrandr2 libgtk-3-0t64 fonts-dejavu-core python3-venv
      - name: Restore Fiji from the cache
        id: fiji-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fiji-dist
          key: fiji-release-${{ env.FIJI_PIN }}
      - name: Download Fiji
        if: steps.fiji-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 5 --retry-delay 10 -o fiji.zip "$FIJI_URL"
          sha256sum fiji.zip
          mkdir fiji-dist
          unzip -q fiji.zip -d fiji-dist
          rm fiji.zip
      - name: Save Fiji to the cache
        if: steps.fiji-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fiji-dist
          key: fiji-release-${{ env.FIJI_PIN }}
      - name: Locate Fiji and record its version
        run: |
          home=$(dirname "$(find "$PWD/fiji-dist" -maxdepth 2 -name fiji-linux-x64 | head -n 1)")
          test -d "$home/jars"
          ij=$(ls "$home/jars" | grep -E '^ij-[0-9]' | head -n 1 | sed -E 's/^ij-(.*)\.jar$/\1/')
          java=$("$(find "$home/java" -path '*/bin/java' | head -n 1)" -version 2>&1 | head -n 1)
          test -n "$ij"
          echo "LC_FIJI_HOME=$home" >> "$GITHUB_ENV"
          echo "FIJI_TESTED=Fiji build $FIJI_PIN (fiji-latest-linux64-jdk; ImageJ $ij; $java), Linux" >> "$GITHUB_ENV"
      - name: Python side of the test apps (labconstrictor-tools) in a venv of our own
        # The host refuses an interpreter that is writable by everybody; the runner's tool-cache Python is, so use /usr/bin/python3.
        run: |
          /usr/bin/python3 -m venv "$HOME/lcvenv"
          "$HOME/lcvenv/bin/pip" install git+https://github.com/CellMigrationLab/LabConstrictor-Tools numpy pandas tifffile scipy scikit-image
      - name: Smoke the release jar in Fiji (the jar built by `build`, byte for byte)
        env:
          LC_FIJI_MODE: jar
          FIJI_TIMEOUT: "300"
        run: |
          # tests/run_cases.py in jar mode runs `mvn package` itself and installs what it finds in target/. A no-op mvn on the PATH of
          # this step makes it install the jar downloaded above instead of rebuilding one; the checksum below proves it.
          mkdir "$RUNNER_TEMP/shim"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/shim/mvn"
          chmod +x "$RUNNER_TEMP/shim/mvn"
          PATH="$RUNNER_TEMP/shim:$PATH" "$HOME/lcvenv/bin/python" tests/run_cases.py $SMOKE_CASES
          want=$(sha256sum "release-files/labconstrictor-fiji-$TAG.jar" | cut -d' ' -f1)
          have=$(sha256sum "$LC_FIJI_HOME/plugins/labconstrictor-fiji.jar" | cut -d' ' -f1)
          echo "release jar $want"; echo "jar in Fiji $have"
          test "$want" = "$have"
      - name: Write the release-notes addendum
        run: |
          # the sentence below is only true while the script checks for that version
          grep -q '0\.3\.0a1' src/main/resources/org/cellmigrationlab/labconstrictor/LabConstrictor_Tools.groovy
          mkdir notes
          {
            echo
            echo "---"
            echo "Tested on: $FIJI_TESTED. Windows and macOS are only smoke-checked (see the workflow run), not tested."
            echo "The plugin needs labconstrictor-tools 0.3.0a1 or newer in the app."
            echo "Install: put labconstrictor-fiji-$TAG.jar into Fiji.app/plugins/ (remove an older labconstrictor-fiji-*.jar) and restart Fiji."
          } > notes/NOTES_ADDENDUM.md
          cat notes/NOTES_ADDENDUM.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notes-addendum
          path: notes
          retention-days: 14
      - name: Collect Fiji logs
        if: failure()
        run: |
          mkdir -p fiji-logs
          cp -r evidence fiji-logs/evidence 2>/dev/null || true
          cp -r "$LC_FIJI_HOME/ImageJ.log" "$LC_FIJI_HOME/logs" fiji-logs/ 2>/dev/null || true
          find /tmp -maxdepth 2 -name 'lchome_fiji_*' -exec cp -r {} fiji-logs/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: release-smoke-logs
          path: fiji-logs
          if-no-files-found: ignore
          retention-days: 14
  smoke-os:
    # Best effort: does the menu entry exist and does it open a dialog listing a registered app, on Windows and on macOS arm64?
    # The result is in the job summary and an annotation; the step never fails the job and `publish` does not wait for these jobs.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win64 }
          - { os: macos-latest, platform: macos-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: release-files
      - name: Restore Fiji from the cache
        id: fiji-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fiji-dist
          key: fiji-release-${{ matrix.platform }}-${{ env.FIJI_PIN }}
      - name: Download Fiji for this platform
        if: steps.fiji-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL --retry 5 --retry-delay 10 -o fiji.zip "https://downloads.imagej.net/fiji/latest/fiji-latest-${{ matrix.platform }}-jdk.zip"
          shasum -a 256 fiji.zip 2>/dev/null || sha256sum fiji.zip
          mkdir fiji-dist
          if [ "$RUNNER_OS" = Windows ]; then "$SYSTEMROOT/System32/tar.exe" -xf fiji.zip -C fiji-dist; else unzip -q fiji.zip -d fiji-dist; fi
          rm fiji.zip
      - name: Save Fiji to the cache
        if: steps.fiji-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fiji-dist
          key: fiji-release-${{ matrix.platform }}-${{ env.FIJI_PIN }}
      - name: Python for the example app on Windows, a conda environment with python.exe at the prefix root
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:CONDA\Scripts\conda.exe" create -y -q -p "$env:RUNNER_TEMP\lcenv" python=3.12
          & "$env:RUNNER_TEMP\lcenv\python.exe" -m pip install git+https://github.com/CellMigrationLab/LabConstrictor-Tools numpy pandas tifffile
          "LC_PYTHON=$env:RUNNER_TEMP\lcenv\python.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Python for the example app, macOS (a venv)
        if: runner.os != 'Windows'
        run: |
          python3 -m venv "$RUNNER_TEMP/lcvenv"
          "$RUNNER_TEMP/lcvenv/bin/pip" install git+https://github.com/CellMigrationLab/LabConstrictor-Tools numpy pandas tifffile
          echo "LC_PYTHON=$RUNNER_TEMP/lcvenv/bin/python" >> "$GITHUB_ENV"
      - name: Smoke the release jar in Fiji (menu entry and dialog)
        id: smoke
        continue-on-error: true
        shell: bash
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          fiji=$(dirname "$(find "$PWD/fiji-dist" -maxdepth 4 -type d -name jars | head -n 1)")
          "$LC_PYTHON" .github/smoke/os_smoke.py "$fiji" "release-files/labconstrictor-fiji-$TAG.jar" smoke-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: smoke-${{ matrix.platform }}
          path: smoke-out
          if-no-files-found: ignore
          retention-days: 14
  publish:
    # Only a published release, and only after the Linux smoke. The Windows and macOS smokes inform but do not block.
    if: github.event_name == 'release'
    needs: [build, smoke-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: release-files
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: notes-addendum
          path: notes
      - name: Attach the files and append the notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" "release-files/labconstrictor-fiji-$TAG.jar" "release-files/labconstrictor-fiji-script-$TAG.zip" release-files/SHA256SUMS --clobber
          gh release view "$TAG" --json body --jq .body > body.md
          if grep -q '^Tested on: ' body.md; then cp body.md notes.md; else cat body.md notes/NOTES_ADDENDUM.md > notes.md; fi  # a re-run does not append twice
          gh release edit "$TAG" --notes-file notes.md
