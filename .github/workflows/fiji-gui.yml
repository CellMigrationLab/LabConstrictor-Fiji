name: fiji-gui
# The Fiji GUI cases (tests/run_cases.py, tests/cases/*.json): desktop Fiji on a virtual screen (Xvfb), the real SciJava dialogs
# through the loose script and through the built jar (LC_FIJI_MODE=jar), as the README describes.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # nightly
concurrency:
  group: fiji-gui-${{ github.ref }}
  cancel-in-progress: true
env:
  # Fiji must be the build with a Java 21 JDK (the "stable" build still ships Java 8 and its launcher does not take --run).
  # Fiji publishes no dated JDK builds, so the build is pinned by the cache: it is downloaded once per FIJI_PIN, kept alive by
  # the nightly run, and the version actually used is printed. To move to a newer Fiji, change FIJI_PIN.
  FIJI_URL: https://downloads.imagej.net/fiji/latest/fiji-latest-linux64-jdk.zip
  FIJI_PIN: "2026-10-07"
jobs:
  # Two parallel jobs, each on its own runner with its own Fiji home, so the loose-script and the jar cases never touch the same
  # Fiji folder (the jar cases unlink plugins/ jars and rmtree scripts/Plugins/LabConstrictor). Measured: the script cases alone
  # take 65-69 min (172 cases, run one after the other), the jar cases far less.
  # Time budget (minutes), job limit above the sum of its steps:
  #   script: setup ~15 + sandbox driver <= 20 + cases <= 80 (78 enforced by `timeout`) + cleanup/logs ~5 = 120 -> job limit 130
  #   jar:    setup ~15 + cases <= 45 (43 enforced by `timeout`) + cleanup/logs ~5 = 65 -> job limit 75
  cases:
    name: fiji-gui (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.mode == 'script' && 130 || 75 }}
    strategy:
      fail-fast: false
      matrix:
        mode: [script, jar]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Install xvfb and the libraries Fiji's Swing/AWT needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libxtst6 libxrender1 libxi6 libxrandr2 libgtk-3-0t64 fonts-dejavu-core python3-venv
      - name: Restore Fiji from the cache
        id: fiji-cache
        uses: actions/cache/restore@v4
        with:
          path: fiji-dist
          key: fiji-${{ env.FIJI_PIN }}
      - name: Download and check Fiji
        if: steps.fiji-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 5 --retry-delay 10 -o fiji.zip "$FIJI_URL"
          sha256sum fiji.zip
          mkdir fiji-dist
          unzip -q fiji.zip -d fiji-dist
          rm fiji.zip
      - name: Save Fiji to the cache (script job only, so it is saved once; right after the download, so a failing case run does not lose it)
        if: steps.fiji-cache.outputs.cache-hit != 'true' && matrix.mode == 'script'
        uses: actions/cache/save@v4
        with:
          path: fiji-dist
          key: fiji-${{ env.FIJI_PIN }}
      - name: Locate Fiji
        run: |
          home=$(dirname "$(find "$PWD/fiji-dist" -maxdepth 2 -name fiji-linux-x64 | head -n 1)")
          test -d "$home/jars"
          ls "$home/jars" | grep -E '^(imagej|scijava-common)-[0-9]' || true
          "$(find "$home/java" -path '*/bin/java' | head -n 1)" -version
          echo "LC_FIJI_HOME=$home" >> "$GITHUB_ENV"
      - name: Install the example app's Python side (labconstrictor-tools) in a venv of our own
        # The host refuses an interpreter that is writable by everybody (trust rules; symlinks are followed). The runner's
        # tool-cache Python is (mode 777), so the venv is made from the distribution's /usr/bin/python3 instead.
        run: |
          /usr/bin/python3 -m venv "$HOME/lcvenv"
          echo "$HOME/lcvenv/bin" >> "$GITHUB_PATH"
          "$HOME/lcvenv/bin/pip" install git+https://github.com/CellMigrationLab/LabConstrictor-Tools numpy pandas tifffile scipy scikit-image
          ls -ld "$HOME/lcvenv/bin" "$(readlink -f "$HOME/lcvenv/bin/python")"
      - name: UI audit judges (tests/ui_audit_logic_check.py, no Fiji, a few seconds) pass on their fake reports and fail on the seeded ones
        if: matrix.mode == 'script'
        timeout-minutes: 5
        run: $HOME/lcvenv/bin/python -u tests/ui_audit_logic_check.py
      - name: Sandbox listing driver (tests/sandbox_listing.py) passes and fails as its contract says
        if: matrix.mode == 'script'
        timeout-minutes: 20
        env:
          FIJI_TIMEOUT: "300"
        run: setsid --wait timeout --kill-after=30 1140 $HOME/lcvenv/bin/python -u tests/sandbox_driver_cases.py
      # `timeout` (inside its own session via setsid) ends the whole process tree before the step limit would, and the cleanup step
      # below kills what escaped (cases run in their own process groups): nothing may outlive a step and touch the Fiji home.
      - name: Cases through the loose Groovy script (fast; includes the unit checks and the script-only cases)
        if: matrix.mode == 'script'
        timeout-minutes: 80   # every case is also killed after FIJI_TIMEOUT seconds (whole process group), so one hung case costs 5 minutes
        env:
          FIJI_TIMEOUT: "300"
          LC_FIJI_MACRO_PROPERTY: "1"
        run: setsid --wait timeout --kill-after=30 4680 $HOME/lcvenv/bin/python -u tests/run_cases.py
      - name: Cases through the built jar (mvn package, installed into Fiji's plugins/, started by the menu command)
        if: matrix.mode == 'jar'
        timeout-minutes: 45
        env:
          LC_FIJI_MODE: jar
          FIJI_TIMEOUT: "300"
        run: setsid --wait timeout --kill-after=30 2580 $HOME/lcvenv/bin/python -u tests/run_cases.py
      - name: Kill leftover test processes
        if: always()
        run: |
          pkill -KILL -f 'tests/(run_cases|sandbox_driver_cases)\.py' || true
          pkill -KILL -f 'fiji-linux-x64|ImageJ-linux64|xvfb-run|Xvfb' || true
          sleep 2
          ps -eo pid,etime,args | grep -E 'run_cases|fiji|Xvfb' | grep -v grep || true
      - name: Collect Fiji logs
        if: failure()
        run: |
          mkdir -p fiji-logs
          cp -r evidence fiji-logs/evidence 2>/dev/null || true
          cp -r "$LC_FIJI_HOME/ImageJ.log" "$LC_FIJI_HOME/logs" fiji-logs/ 2>/dev/null || true
          find /tmp -maxdepth 2 -name 'lchome_fiji_*' -exec cp -r {} fiji-logs/ \; 2>/dev/null || true
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fiji-gui-logs-${{ matrix.mode }}
          path: fiji-logs
          if-no-files-found: ignore
          retention-days: 14
  # Keeps the status name `fiji-gui` (what a branch protection rule would require) for the pair of matrix jobs.
  fiji-gui:
    needs: cases
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both modes must have passed
        run: |
          echo "cases: ${{ needs.cases.result }}"
          test "${{ needs.cases.result }}" = success
