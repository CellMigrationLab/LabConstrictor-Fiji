# First run still pending. Builds the jar; the GUI cases need a Fiji installation and a display (see README).
name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with: { name: labconstrictor-fiji-jar, path: target/*.jar }
